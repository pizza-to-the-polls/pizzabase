name: Test

on:
  pull_request:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: read_version
        run: echo "NODE_VER=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.read_version.outputs.NODE_VER }}

      - name: npm install dependencies
        run: npm install

      - name: run prettier
        run: npm run prettier

      - name: run tslint
        run: npm run lint

      - name: type check
        run: npx tsc --noEmit

      - name: run tests
        run: npm run test
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USERNAME: postgres

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Read Node version
        id: read_version
        run: echo "NODE_VER=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.read_version.outputs.NODE_VER }}

      - name: npm install dependencies
        run: npm install --include=dev

      - name: build typescript
        run: npx tsc --build

  deploy-staging:
    if: >-
      github.base_ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [test, build]
    concurrency:
      group: pizzabase-shared-staging
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NODE_ENV: "production"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read Node version
        id: read_version
        run: echo "NODE_VER=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.read_version.outputs.NODE_VER }}

      - name: npm install dependencies
        run: npm install --include=dev

      - name: build typescript
        run: npx tsc --build

      - name: Pre-deploy health check
        id: pre_health
        run: bash scripts/health-check.sh https://base-next.polls.pizza/health
        continue-on-error: true

      - name: deploy to aws
        uses: serverless/github-action@v4.0.0
        with:
          args: deploy --stage dev
        env:
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          AURORA_RESOURCE_ARN: ${{ secrets.AURORA_RESOURCE_ARN }}
          AURORA_SECRET_ARN: ${{ secrets.AURORA_SECRET_ARN }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          ALLOWED_ORIGINS: "polls.pizza,localhost"
          STATIC_SITE: https://next.polls.pizza
          ZAP_NEW_REPORT: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_NEW_LOCATION: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_NEW_ORDER: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_NEW_UPLOAD: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_NEW_TRUCK: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_SKIP_REPORT: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_TRUCK_REPORT: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_ORDER_REPORT: ${{ secrets.STAGING_ZAP_ALL }}
          ZAP_CANCEL_ORDER_REPORT: ${{ secrets.STAGING_ZAP_ALL }}
          BUGSNAG_KEY: ${{ secrets.BUGSNAG_KEY }}
          BUGSNAG_ENV: "dev"
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_KEY }}
          STRIPE_PRODUCT_ID: ${{ secrets.STAGING_STRIPE_PRODUCT_ID }}
          STRIPE_SECRET_WH: ${{ secrets.STAGING_STRIPE_WH }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          JWT_SECRET: "enjoying-pineapple-on-pizza-is-valid"
          SIGHTENGINE_API_USER: ${{ secrets.SIGHTENGINE_API_USER }}
          SIGHTENGINE_API_SECRET: ${{ secrets.SIGHTENGINE_API_SECRET }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

      - name: run migrations
        run: npm run migration:run
        env:
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          AURORA_RESOURCE_ARN: ${{ secrets.AURORA_RESOURCE_ARN }}
          AURORA_SECRET_ARN: ${{ secrets.AURORA_SECRET_ARN }}
          AWS_REGION: us-west-2

      - name: Post-deploy health check
        id: post_health
        run: bash scripts/health-check.sh https://base-next.polls.pizza/health
        timeout-minutes: 3

      - name: Rollback on health failure
        if: steps.post_health.outcome == 'failure' && steps.pre_health.outcome == 'success'
        uses: serverless/github-action@v4.0.0
        with:
          args: rollback --stage dev
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

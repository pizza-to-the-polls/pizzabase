service: pizzabase

plugins:
  - serverless-domain-manager
  - serverless-offline

provider:
  name: aws
  runtime: nodejs${file(.nvmrc)}.x
  # 120s: socialPost runs fire-and-forget in-process (lambda.ts holds the
  # invocation) and Threads video containers can take minutes to process.
  timeout: 120
  region: us-west-2
  environment:
    NODE_ENV: production

    DB_NAME: ${env:DB_NAME}
    AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
    AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}

    ZAP_NEW_REPORT: ${env:ZAP_NEW_REPORT}
    ZAP_NEW_LOCATION: ${env:ZAP_NEW_LOCATION}
    ZAP_NEW_ORDER: ${env:ZAP_NEW_ORDER}
    ZAP_NEW_TRUCK: ${env:ZAP_NEW_TRUCK}
    ZAP_NEW_UPLOAD: ${env:ZAP_NEW_UPLOAD}
    ZAP_SKIP_REPORT: ${env:ZAP_SKIP_REPORT}
    ZAP_ORDER_REPORT: ${env:ZAP_ORDER_REPORT}
    ZAP_CANCEL_ORDER_REPORT: ${env:ZAP_CANCEL_ORDER_REPORT}
    ZAP_TRUCK_REPORT: ${env:ZAP_TRUCK_REPORT}

    TWITTER_API_KEY: ${env:TWITTER_API_KEY, ''}
    TWITTER_API_SECRET: ${env:TWITTER_API_SECRET, ''}
    TWITTER_ACCESS_TOKEN: ${env:TWITTER_ACCESS_TOKEN, ''}
    TWITTER_ACCESS_SECRET: ${env:TWITTER_ACCESS_SECRET, ''}

    GOOGLE_MAPS_KEY: ${env:GOOGLE_MAPS_KEY}
    BUGSNAG_KEY: ${env:BUGSNAG_KEY}
    MAILGUN_API_KEY: ${env:MAILGUN_API_KEY}
    JWT_SECRET: ${env:JWT_SECRET}

    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS}
    STATIC_SITE: ${env:STATIC_SITE}
    UPLOAD_S3_BUCKET: reports.polls.pizza

    RAW_UPLOADS_BUCKET: ${env:RAW_UPLOADS_BUCKET, 'raw.polls.pizza'}
    MEDIA_CALLBACK_SECRET: ${env:MEDIA_CALLBACK_SECRET, ''}
    IMAGE_MAX_DIMENSION: ${env:IMAGE_MAX_DIMENSION, '1920'}
    IMAGE_QUALITY: ${env:IMAGE_QUALITY, '85'}
    MEDIACONVERT_ROLE_ARN: ${env:MEDIACONVERT_ROLE_ARN, ''}

    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    STRIPE_SECRET_WH: ${env:STRIPE_SECRET_WH}
    STRIPE_PRODUCT_ID: ${env:STRIPE_PRODUCT_ID}

    SIGHTENGINE_API_USER: ${env:SIGHTENGINE_API_USER}
    SIGHTENGINE_API_SECRET: ${env:SIGHTENGINE_API_SECRET}

    BSKY_PDS_URL: ${env:BSKY_PDS_URL, ''}
    BSKY_HANDLE: ${env:BSKY_HANDLE, ''}
    BSKY_APP_PASSWORD: ${env:BSKY_APP_PASSWORD, ''}

    THREADS_USER_ID: ${env:THREADS_USER_ID, ''}

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "secretsmanager:GetSecretValue"
        - "secretsmanager:PutResourcePolicy"
        - "secretsmanager:PutSecretValue"
        - "secretsmanager:DeleteSecret"
        - "secretsmanager:DescribeSecret"
        - "secretsmanager:TagResource"
      Resource:
        - "arn:aws:secretsmanager:*:*:secret:PizzaBase*"
    - Effect: "Allow"
      Action:
        - "secretsmanager:CreateSecret"
        - "secretsmanager:ListSecrets"
        - "secretsmanager:GetRandomPassword"
        - "tag:GetResources"
        - "rds-data:BatchExecuteStatement"
        - "rds-data:BeginTransaction"
        - "rds-data:CommitTransaction"
        - "rds-data:ExecuteStatement"
        - "rds-data:RollbackTransaction"
      Resource:
        - "*"
    - Effect: "Allow"
      Action:
        - "s3:*"
      Resource:
        - "arn:aws:s3:::*"
    - Effect: "Allow"
      Action:
        - "lambda:InvokeFunction"
      Resource:
        - "arn:aws:lambda:us-west-2:*:function:pizzabase-*"
    - Effect: "Allow"
      Action:
        - "mediaconvert:CreateJob"
        - "mediaconvert:GetJob"
        - "mediaconvert:DescribeEndpoints"
      Resource:
        - "*"
    - Effect: "Allow"
      Action:
        - "iam:PassRole"
      Resource: ${env:MEDIACONVERT_ROLE_ARN, '*'}

package:
  patterns:
    - build/**
    - package.json
    - "!.git/**"
    - "!.github/**"
    - "!docs/**"
    - "!scripts/**"
    - "!src/**/*.test.ts"
    - "!src/tests/**"

functions:
  app:
    handler: build/lambda.handler
    events:
      - http: ANY /
      - http: ANY /{proxy+}

  refreshThreadsToken:
    handler: build/refresh-threads-token.handler
    events:
      - schedule: rate(45 days)

  on-s3-upload-process-exif:
    handler: build/lambdas/onS3UploadProcessExif.handler
    timeout: 60
    memorySize: 512
    environment:
      UPLOAD_S3_BUCKET: ${env:UPLOAD_S3_BUCKET, 'reports.polls.pizza'}
      AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
      AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}
      DB_NAME: ${env:DB_NAME}
    events:
      - s3:
          bucket: ${env:RAW_UPLOADS_BUCKET, 'raw.polls.pizza'}
          event: s3:ObjectCreated:*
          existing: true

  on-media-format:
    handler: build/lambdas/onMediaFormat.handler
    timeout: 120
    memorySize: 1024
    layers:
      - arn:aws:lambda:us-west-2:${env:AWS_ACCOUNT_ID}:layer:sharp:5
    environment:
      RAW_UPLOADS_BUCKET: ${env:RAW_UPLOADS_BUCKET, 'raw.polls.pizza'}
      UPLOAD_S3_BUCKET: ${env:UPLOAD_S3_BUCKET, 'reports.polls.pizza'}
      AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
      AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}
      DB_NAME: ${env:DB_NAME}
      IMAGE_MAX_DIMENSION: ${env:IMAGE_MAX_DIMENSION, '1920'}
      IMAGE_QUALITY: ${env:IMAGE_QUALITY, '85'}
      MEDIACONVERT_ROLE_ARN: ${env:MEDIACONVERT_ROLE_ARN, ''}
    # No direct S3 trigger: two ObjectCreated:* configs on one bucket overlap.
    # on-s3-upload-process-exif chains this function via lambda:InvokeFunction.

  on-mediaconvert-complete:
    handler: build/lambdas/onMediaConvertComplete.handler
    timeout: 30
    environment:
      UPLOAD_S3_BUCKET: ${env:UPLOAD_S3_BUCKET, 'reports.polls.pizza'}
      AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
      AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}
      DB_NAME: ${env:DB_NAME}
    events:
      - eventBridge:
          pattern:
            source:
              - "aws.mediaconvert"
            detail-type:
              - "MediaConvert Job State Change"
            detail:
              status:
                - "COMPLETE"
                - "ERROR"

custom:
  customDomain:
    domainName: base.polls.pizza
    basePath: ""
    stage: prod
    createRoute53Record: true

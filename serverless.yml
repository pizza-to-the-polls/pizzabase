service: pizzabase

plugins:
  - serverless-domain-manager
  - serverless-offline

provider:
  name: aws
  runtime: nodejs${file(.nvmrc)}.x
  timeout: 30
  region: us-west-2
  environment:
    NODE_ENV: production

    DB_NAME: ${env:DB_NAME}
    AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
    AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}

    ZAP_NEW_REPORT: ${env:ZAP_NEW_REPORT}
    ZAP_NEW_LOCATION: ${env:ZAP_NEW_LOCATION}
    ZAP_NEW_ORDER: ${env:ZAP_NEW_ORDER}
    ZAP_NEW_TRUCK: ${env:ZAP_NEW_TRUCK}
    ZAP_NEW_UPLOAD: ${env:ZAP_NEW_UPLOAD}
    ZAP_SKIP_REPORT: ${env:ZAP_SKIP_REPORT}
    ZAP_ORDER_REPORT: ${env:ZAP_ORDER_REPORT}
    ZAP_CANCEL_ORDER_REPORT: ${env:ZAP_CANCEL_ORDER_REPORT}
    ZAP_TRUCK_REPORT: ${env:ZAP_TRUCK_REPORT}

    GOOGLE_MAPS_KEY: ${env:GOOGLE_MAPS_KEY}
    BUGSNAG_KEY: ${env:BUGSNAG_KEY}
    MAILGUN_API_KEY: ${env:MAILGUN_API_KEY}
    JWT_SECRET: ${env:JWT_SECRET}

    ALLOWED_ORIGINS: ${env:ALLOWED_ORIGINS}
    STATIC_SITE: ${env:STATIC_SITE}
    UPLOAD_S3_BUCKET: reports.polls.pizza

    RAW_UPLOADS_BUCKET: ${env:RAW_UPLOADS_BUCKET, "pizzabase-raw-uploads"}
    SCRUBBED_UPLOADS_BUCKET: ${env:SCRUBBED_UPLOADS_BUCKET, "pizzabase-scrubbed-uploads"}
    PROCESSED_UPLOADS_BUCKET: ${env:PROCESSED_UPLOADS_BUCKET, "pizzabase-processed-uploads"}

    IMAGE_MAX_DIMENSION: ${env:IMAGE_MAX_DIMENSION, "1920"}
    IMAGE_QUALITY: ${env:IMAGE_QUALITY, "85"}
    VIDEO_MAX_DIMENSION: ${env:VIDEO_MAX_DIMENSION, "1080"}

    MEDIACONVERT_ROLE_ARN: ${env:MEDIACONVERT_ROLE_ARN, ""}

    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    STRIPE_SECRET_WH: ${env:STRIPE_SECRET_WH}
    STRIPE_PRODUCT_ID: ${env:STRIPE_PRODUCT_ID}

  iamRoleStatements:
    - Effect: "Allow"
      Action:
        - "secretsmanager:GetSecretValue"
        - "secretsmanager:PutResourcePolicy"
        - "secretsmanager:PutSecretValue"
        - "secretsmanager:DeleteSecret"
        - "secretsmanager:DescribeSecret"
        - "secretsmanager:TagResource"
      Resource:
        - "arn:aws:secretsmanager:*:*:secret:PizzaBase*"
    - Effect: "Allow"
      Action:
        - "secretsmanager:CreateSecret"
        - "secretsmanager:ListSecrets"
        - "secretsmanager:GetRandomPassword"
        - "tag:GetResources"
        - "rds-data:BatchExecuteStatement"
        - "rds-data:BeginTransaction"
        - "rds-data:CommitTransaction"
        - "rds-data:ExecuteStatement"
        - "rds-data:RollbackTransaction"
      Resource:
        - "*"
    - Effect: "Allow"
      Action:
        - "s3:*"
      Resource:
        - "arn:aws:s3:::*"
    - Effect: "Allow"
      Action:
        - "mediaconvert:CreateJob"
        - "mediaconvert:DescribeEndpoints"
      Resource:
        - "*"
    - Effect: "Allow"
      Action:
        - "iam:PassRole"
      Resource:
        - "arn:aws:iam::*:role/MediaConvertRole"

package:
  patterns:
    - build/**
    - build/lambdas/**
    - package.json
    - "!.git/**"
    - "!.github/**"
    - "!docs/**"
    - "!scripts/**"
    - "!src/**/*.test.ts"
    - "!src/tests/**"

functions:
  app:
    handler: build/lambda.handler
    events:
      - http: ANY /
      - http: ANY /{proxy+}

  on-s3-upload-process-exif:
    handler: build/lambdas/onS3UploadProcessExif.handler
    events:
      - s3:
          bucket: ${env:RAW_UPLOADS_BUCKET, "pizzabase-raw-uploads"}
          event: s3:ObjectCreated:*
          existing: true
    environment:
      SCRUBBED_UPLOADS_BUCKET: ${env:SCRUBBED_UPLOADS_BUCKET, "pizzabase-scrubbed-uploads"}
      DB_NAME: ${env:DB_NAME}
      AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
      AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}

  on-media-format:
    handler: build/lambdas/onMediaFormat.handler
    events:
      - s3:
          bucket: ${env:SCRUBBED_UPLOADS_BUCKET, "pizzabase-scrubbed-uploads"}
          event: s3:ObjectCreated:*
          existing: true
    environment:
      PROCESSED_UPLOADS_BUCKET: ${env:PROCESSED_UPLOADS_BUCKET, "pizzabase-processed-uploads"}
      SCRUBBED_UPLOADS_BUCKET: ${env:SCRUBBED_UPLOADS_BUCKET, "pizzabase-scrubbed-uploads"}
      IMAGE_MAX_DIMENSION: ${env:IMAGE_MAX_DIMENSION, "1920"}
      IMAGE_QUALITY: ${env:IMAGE_QUALITY, "85"}
      VIDEO_MAX_DIMENSION: ${env:VIDEO_MAX_DIMENSION, "1080"}
      MEDIACONVERT_ROLE_ARN: ${env:MEDIACONVERT_ROLE_ARN, ""}
      PIZZABASE_CALLBACK_URL: ${env:PIZZABASE_CALLBACK_URL, ""}

  on-mediaconvert-complete:
    handler: build/lambdas/onMediaConvertComplete.handler
    events:
      - cloudwatchEvent:
          event:
            source:
              - aws.mediaconvert
            detail-type:
              - MediaConvert Job State Change
    environment:
      PROCESSED_UPLOADS_BUCKET: ${env:PROCESSED_UPLOADS_BUCKET, "pizzabase-processed-uploads"}
      DB_NAME: ${env:DB_NAME}
      AURORA_RESOURCE_ARN: ${env:AURORA_RESOURCE_ARN}
      AURORA_SECRET_ARN: ${env:AURORA_SECRET_ARN}

custom:
  customDomain:
    domainName: base.polls.pizza
    basePath: ""
    stage: prod
    createRoute53Record: true
